# GET ALL PARAMETERS USABLE FOR CUSTOM CONFIG BY RUNNING:
## --------------------------------------------------------------
## |          rosrun mrs_uav_core get_public_params.py          #
## --------------------------------------------------------------

mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    state_estimators: [
      "gps_garmin",
    ]

    initial_state_estimator: "gps_garmin" # will be used as the first state estimator
    agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback)

  uav_manager:

    midair_activation:

      after_activation:
        controller: "Se3Controller"
        tracker: "MpcTracker"

mrs_uav_hw_api:

  outputs:

    distance_sensor:      true
    gnss:                 true
    gnss_status:          true
    rtk:                  false
    imu:                  true
    altitude:             true
    magnetometer_heading: true
    rc_channels:          true
    battery_state:        true
    position:             true
    orientation:          true
    velocity:             true
    angular_velocity:     true
    odometry:             false
    ground_truth:         false
