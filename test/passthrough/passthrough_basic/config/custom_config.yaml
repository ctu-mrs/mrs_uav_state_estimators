# GET ALL PARAMETERS USABLE FOR CUSTOM CONFIG BY RUNNING:
## --------------------------------------------------------------
## |          rosrun mrs_uav_core get_public_params.py          #
## --------------------------------------------------------------

mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    state_estimators: [
      "passthrough",
    ]

    initial_state_estimator: "passthrough" # will be used as the first state estimator
    agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback)

  uav_manager:

    midair_activation:

      after_activation:
        controller: "Se3Controller"
        tracker: "MpcTracker"

mrs_uav_hw_api:

  outputs:
    distance_sensor:      false
    gnss:                 false
    gnss_status:          false
    rtk:                  false
    imu:                  false
    altitude:             false
    magnetometer_heading: false
    rc_channels:          true
    battery_state:        false
    position:             false
    orientation:          false
    velocity:             false
    angular_velocity:     false
    odometry:             true
    ground_truth:         false
